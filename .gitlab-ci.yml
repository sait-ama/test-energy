stages:
  - prepare
  - lint
  - build
  - deploy
  - test_e2e

variables:
  DOCKER_BUILDKIT: "1"
  DOCKER_API_VERSION: "1.43"
  BUILDKIT_INLINE_CACHE: "1"

default:
  interruptible: true
  image: node:23.7-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest-9 --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
      prefix: pnpm-cache

prepare_dependencies:
  stage: prepare
  script:
    - pnpm install --frozen-lockfile
  rules:
    - changes:
        - pnpm-lock.yaml

lint:
  stage: lint
  script:
    - pnpm dlx turbo run lint --parallel --cache-dir=".turbo" --output-logs=errors-only
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  cache:
    key: "$CI_PROJECT_NAME-deps-lint"
    paths:
      - node_modules/
      - .turbo
      - .pnpm-store
    policy: pull-push
  needs:
    - job: prepare_dependencies
      artifacts: true

build:
  stage: build
  image: docker:dind
  before_script:
    - docker login $DOCKER_REGISTRY -u $DOCKER_REGISTRY_USERNAME -p $DOCKER_REGISTRY_PASSWORD
  script:
    - docker pull $DOCKER_REGISTRY/$DOCKER_REGISTRY_FOLDER/$DOCKER_IMAGE_NAME:latest || true
    - docker build -f apps/web/Dockerfile --build-arg BUILDKIT_INLINE_CACHE=1  --cache-from type=registry,ref=$DOCKER_REGISTRY/$DOCKER_REGISTRY_FOLDER/$DOCKER_IMAGE_NAME:latest -t $DOCKER_REGISTRY/$DOCKER_REGISTRY_FOLDER/$DOCKER_IMAGE_NAME:latest --build-arg GIT_HASH=$CI_COMMIT_SHORT_SHA --build-arg S3_BUCKET=$S3_BUCKET --build-arg POSTHOG_HOST=$POSTHOG_HOST --build-arg POSTHOG_KEY=$POSTHOG_KEY --build-arg S3_ACCESS_KEY=$S3_ACCESS_KEY --build-arg S3_SECRET_KEY=$S3_SECRET_KEY --build-arg CI=1 --build-arg SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN .
    - docker push $DOCKER_REGISTRY/$DOCKER_REGISTRY_FOLDER/$DOCKER_IMAGE_NAME:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $GITLAB_DEV_BRANCH'
    - if: '$CI_COMMIT_BRANCH == $GITLAB_PROD_BRANCH'
    - when: manual
      allow_failure: false
  resource_group: "deploy-$CI_COMMIT_BRANCH"

