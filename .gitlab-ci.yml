deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - apk add curl
    - cd /opt
    - curl --header "JOB-TOKEN:$CI_JOB_TOKEN" --output id_rsa "$CI_API_V4_URL/projects/$CI_PROJECT_ID/secure_files/8/download"
    - chmod 600 id_rsa
  script:
    - ssh -i /opt/id_rsa -o StrictHostKeyChecking=no $DEPLOY_DEV_USERNAME@$DEPLOY_DEV_IP "cd $DEPLOY_DEV_APP_PATH && docker compose pull && docker compose up -d front_demo && docker compose up -d front_stage"
  rules:
    - if: '$CI_COMMIT_BRANCH == $GITLAB_DEV_BRANCH'
    - if: '$CI_COMMIT_BRANCH == $GITLAB_PROD_BRANCH'
    - when: manual
      allow_failure: false
  resource_group: "deploy-$CI_COMMIT_BRANCH"
  needs:
    - build
