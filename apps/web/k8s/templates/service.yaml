apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextjs-monorepo.fullname" . }}
  labels:
    {{- include "nextjs-monorepo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.service.port | default 80 }}
      targetPort: {{ .Values.service.targetPort | default 3000 }}
      protocol: TCP
  selector:
    {{- include "nextjs-monorepo.selectorLabels" . | nindent 4 }}
